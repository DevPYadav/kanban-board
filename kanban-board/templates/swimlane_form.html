{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2>{{ action }} Swimlane</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" required value="{{ form_data.name if form_data else (swimlane.name if swimlane else '') }}">
        </div>
        <div class="form-group">
            <label for="order">Order</label>
            <input type="number" id="order" name="order" value="{{ form_data.order if form_data else (swimlane.order if swimlane else 0) }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">{{ action }} Swimlane</button>
            <a href="{{ url_for('index') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
