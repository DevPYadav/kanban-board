{% extends 'base.html' %}

{% block content %}
<div class="form-container">
    <h2>{{ action }} Column</h2>
    <form method="POST">
        <div class="form-group">
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" required value="{{ column.name if column else '' }}">
        </div>
        <div class="form-group">
            <label for="swimlane_id">Swimlane *</label>
            <select id="swimlane_id" name="swimlane_id" required>
                {% for swimlane in swimlanes %}
                <option value="{{ swimlane.id }}" {% if column and column.swimlane_id == swimlane.id %}selected{% endif %}>
                    {{ swimlane.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label for="order">Order</label>
            <input type="number" id="order" name="order" value="{{ column.order if column else 0 }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">{{ action }} Column</button>
            <a href="{{ url_for('index') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
